<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgCream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9FB" />
      <stop offset="100%" stop-color="#FFE8F0" />
    </linearGradient>
    <radialGradient id="lensGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF5F8" />
      <stop offset="65%" stop-color="#FDE2EC" />
      <stop offset="100%" stop-color="#FBCFE8" />
    </radialGradient>
    <radialGradient id="apertureGlow" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#F43F5E" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#FFE4EE" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="roseBlush" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
  </defs>

  <!-- Soft strawberry-cream square background with rounded corners -->
  <rect width="512" height="512" rx="108" fill="url(#bgCream)" />

  <!-- Subtle outer camera ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#FBCFE8" stroke-width="6" />
  <circle cx="256" cy="256" r="160" fill="url(#lensGrad)" stroke="#F9A8D4" stroke-width="5" />

  <!-- Rose aperture ring -->
  <circle cx="256" cy="256" r="110" fill="none" stroke="url(#roseBlush)" stroke-width="6" stroke-dasharray="24 10" />
  <circle cx="256" cy="256" r="85" fill="#4C2634" />
  <circle cx="256" cy="256" r="85" fill="url(#apertureGlow)" />

  <!-- Center lens reflection -->
  <circle cx="225" cy="225" r="30" fill="#ffffff" fill-opacity="0.7" />
  <circle cx="280" cy="280" r="14" fill="#FDA4AF" fill-opacity="0.75" />

  <!-- Top camera flash/rangefinder dot -->
  <circle cx="390" cy="120" r="14" fill="#F43F5E" />
  <circle cx="120" cy="120" r="10" fill="#F9A8D4" />

  <!-- Cute viewfinder corner marks -->
  <path d="M 80 140 L 80 80 L 140 80" fill="none" stroke="#F43F5E" stroke-width="7" stroke-linecap="round" />
  <path d="M 432 140 L 432 80 L 372 80" fill="none" stroke="#F43F5E" stroke-width="7" stroke-linecap="round" />
  <path d="M 80 372 L 80 432 L 140 432" fill="none" stroke="#F43F5E" stroke-width="7" stroke-linecap="round" />
  <path d="M 432 372 L 432 432 L 372 432" fill="none" stroke="#F43F5E" stroke-width="7" stroke-linecap="round" />
</svg>
